classes:
  monk: $tmpl('monk2.yaml')
utils:
  ability_modifier(x): '$lib.math.floor((x - 10) / 2)'
# game:
#   players:
#     :type: $list($type('player.yaml'))
#     :value: []
  

# $type: Player
abilities:
  charisma:
    base: 8
    modifier: '#.utils.ability_modifier(.base)'
  constitution:
    base: 10
    modifier: '#.utils.ability_modifier(.base)'
  dexterity:
    base: 14
    modifier: '#.utils.ability_modifier(.base)'
  intelligence:
    base: 13
    modifier: '#.utils.ability_modifier(.base)'
  strength:
    base: 15
    modifier: '#.utils.ability_modifier(.base)'
  wisdom:
    base: 12
    modifier: '#.utils.ability_modifier(.base)'
armor_class: '10 + #.abilities.dexterity.modifier'
speed: 30
initiative:
  base: '#.abilities.dexterity.modifier'
  roll(): 1d20 + .base
hit_die: d1
hit_points:
#   '!validate':
#     - .value >= 0
#     - .value <= .max
  value: 3
  max: 5
features: {}
actions:
  unarmed_strike:
    die: d4
    type: action
proficiencies:
  weapon: []
resources: {}
rest:
  short(): |
    #.hit_points.value = $lib.math.min(#.hit_points.value + #.hit_die, #.hit_points.max)
  long(): |
    #.hit_points.value = #.hit_points.max
