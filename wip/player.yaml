$type: Player
abilities:
  charisma:
    base: 0
    modifier: '@.utils.ability_modifier(.base)'
  constitution:
    base: 0
    modifier: '@.utils.ability_modifier(.base)'
  dexterity:
    base: 0
    modifier: '@.utils.ability_modifier(.base)'
  intelligence:
    base: 0
    modifier: '@.utils.ability_modifier(.base)'
  strength:
    base: 0
    modifier: '@.utils.ability_modifier(.base)'
  wisdom:
    base: 0
    modifier: '@.utils.ability_modifier(.base)'
armor_class: 10 + $.abilities.dexterity.modifier
speed: 0
initiative:
  base: $.abilities.dexterity.modifier
  roll(): 1d20 + .base
hit_die: 1d1
hit_points:
  '!validate':
    - .value >= 0
    - .value <= .max
  value: 0
  max: 0
features: {}
actions:
  unarmed_strike:
    die: d4
    type: action
proficiencies:
  weapon: []
resources: {}
rest:
  short(): |
    $.hit_points.value = $lib.math.min($.hit_points.value + $.hit_die, $.hit_points.max)
  long(): |
    $.hit_points.value = $.hit_points.max
