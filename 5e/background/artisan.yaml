'@': Character
$if: "@.background == 'artisan'"

'@.proficiencies.skill':
  - investigation
  - persuasion
'@.proficiencies.tool':
  :label: Background Tool Proficiency
  :doc: 'Choose an artisan tool with which your character is proficient.'
  :param: true
  :type: array
  :options:
    - alchemists_supplies
    - brewers_supplies
    - calligraphers_supplies
    - carpenters_tools
    - cartographers_tools
    - cobblers_tools
    - cooks_utensils
    - glassblowers_tools
    - jewelers_tools
    - leatherworkers_tools
    - masons_tools
    - painters_supplies
    - potters_tools
    - smiths_tools
    - tinkers_tools
    - weavers_tools
    - woodcarvers_tools
  :count: 1
'@.improvements.background':
  :label: Background Ability Scores
  :doc: 'Pick three to receive +1; an ability cannot be chosen more than twice.'
  :param: true
  :type: array
  :options: [intelligence, wisdom, charisma]
  :count: 3
  '!validate':
    - '$lib.list.size($lib.list.unique(.)) > 1'
