# Point buy and the shape of one ability entry, attached as `#.ability` by
# 5e/main.yaml and used by 5e/character.yaml.

# Points bought above 8: each costs one, the sixth and seventh (14, 15) two.
'point_cost(bought)': bought + (bought >= 6) + (bought >= 7)

point_buy:
  :label: Point Buy
  :doc: 27 points buy your six scores; each starts at 8 and tops out at 15.
  '!validate':
    - .spent <= .budget
  budget: 27
  spent: >-
    #.ability.point_cost(@.abilities.strength.bought) +
    #.ability.point_cost(@.abilities.dexterity.bought) +
    #.ability.point_cost(@.abilities.constitution.bought) +
    #.ability.point_cost(@.abilities.intelligence.bought) +
    #.ability.point_cost(@.abilities.wisdom.bought) +
    #.ability.point_cost(@.abilities.charisma.bought)

# One ability: 8, plus what you bought, plus the improvements that named it.
'entry(ability, label)':
  bought:
    :label: '{label}'
    :doc: Points bought for {label} above its base 8, 0 to 7 (a score of 8 to 15).
    :param: true
    :type: integer
    :min: 0
    :max: 7
  base: 8 + .bought + $lib.list.count(@.improvements, ability)
  modifier: $.utils.ability_modifier(.base)
