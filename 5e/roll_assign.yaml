# Roll and assign, applied when the character picks
# `ability_method: roll_assign`: six 4d6-drop-lowest rolls, each assigned to
# one ability by its position.

$: Character

'@.roll_assign':
  $if: "@.ability_method == 'roll_assign'"
  :label: Roll and Assign
  :doc: Roll 4d6 six times, dropping the lowest die, then assign each roll to an ability.
  # Six picks covering all six rolls: each taken exactly once.
  '!validate':
    - $lib.set.subset([1, 2, 3, 4, 5, 6], .taken)
    - $lib.list.size(.taken) == 6
  rolls:
    - $lib.dice.keep_highest(4, 6, 3)
    - $lib.dice.keep_highest(4, 6, 3)
    - $lib.dice.keep_highest(4, 6, 3)
    - $lib.dice.keep_highest(4, 6, 3)
    - $lib.dice.keep_highest(4, 6, 3)
    - $lib.dice.keep_highest(4, 6, 3)
  taken:
    - '@.abilities.strength.roll'
    - '@.abilities.dexterity.roll'
    - '@.abilities.constitution.roll'
    - '@.abilities.intelligence.roll'
    - '@.abilities.wisdom.roll'
    - '@.abilities.charisma.roll'

'@.abilities':
  $if: "@.ability_method == 'roll_assign'"
  strength: "#.ability.assigned_roll('Strength')"
  dexterity: "#.ability.assigned_roll('Dexterity')"
  constitution: "#.ability.assigned_roll('Constitution')"
  intelligence: "#.ability.assigned_roll('Intelligence')"
  wisdom: "#.ability.assigned_roll('Wisdom')"
  charisma: "#.ability.assigned_roll('Charisma')"
