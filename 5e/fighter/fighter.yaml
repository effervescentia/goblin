# D&D 5e Fighter. Applied onto a 5e/character.yaml actor:
#   engine.apply(actor, 'fighter/fighter.yaml')

$: Character

'@.fighter': {}

'@.hit_die': d10
'@.hit_points':
  max: 10 + @.abilities.constitution.modifier
  current: '@.hit_points.max'
'@.proficiencies.armor':
  - all_armor
  - shields
'@.proficiencies.weapon':
  - simple_weapons
  - martial_weapons
'@.proficiencies.saving_throws':
  - strength
  - constitution
'@.skills.trained':
  :label: Skill Proficiencies
  :doc: 'Choose two: acrobatics, animal_handling, athletics, history, insight, intimidation, perception, survival.'
  :param: true
  :type: array
  :options: [acrobatics, animal_handling, athletics, history, insight, intimidation, perception, survival]
  :count: 2
  :unique: true
'@.features':
  +fighting_style:
    :label: Fighting Style
    :doc: Pick the combat style you trained in.
    :param: true
    :type: string
    :options: [archery, defense, dueling, great_weapon_fighting, protection, two_weapon_fighting]
  +second_wind:
    :label: Second Wind
    :doc: Regain hit points in a pinch, once per rest.
    '@.resources':
      +second_wind:
        :label: Second Wind
        :doc: Expend to regain hit points. Restores on a short or long rest.
        current: .max
        max: 1
        recover: short
    '@.actions':
      +second_wind:
        :label: Second Wind
        :doc: As a bonus action, regain 1d10 + fighter level hit points, up to your maximum.
        type: bonus_action
        # Adds 1d10 + level, no more than is missing, only while a use remains
        # (the comparison is 0 or 1) — so with none left nothing changes.
        'use()': |
          @.hit_points.current += $lib.math.min(1d10 + @.level, @.hit_points.max - @.hit_points.current) * (@.resources.second_wind.current > 0)
          @.resources.second_wind.current -= @.resources.second_wind.current > 0
  +action_surge:
    :label: Action Surge
    :doc: Take one additional action on your turn. Restores on a short rest.
    $if: '@.level >= 2'
    '@.resources':
      +action_surge:
        :label: Action Surge
        :doc: Expend to gain an additional action. Restores on a short or long rest.
        current: .max
        max: 1 + (@.level >= 17)
        recover: short
  +martial_archetype:
    :label: Martial Archetype
    :doc: 'Choose a subclass: Champion, Battle Master, or Eldritch Knight. Its features come from 5e/<subclass>.yaml.'
    :param: true
    :type: string
    :options: [champion, battle_master, eldritch_knight]
    $if: '@.level >= 3'
  +ability_score_improvement_1:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 4'
    '@.improvements.level_4': '#.feature.ability_improvement(4)'
  +extra_attack:
    :label: Extra Attack
    :doc: Strike twice whenever you take the Attack action.
    $if: '@.level >= 5'
    '+@.attacks': 1 + (@.level >= 11) + (@.level >= 20)
    '@.actions':
      +extra_attack:
        :label: Extra Attack
        :doc: Make two attacks instead of one (three at 11, four at 20).
  +ability_score_improvement_2:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 6'
    '@.improvements.level_6': '#.feature.ability_improvement(6)'
  +ability_score_improvement_3:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 8'
    '@.improvements.level_8': '#.feature.ability_improvement(8)'
  +indomitable:
    :label: Indomitable
    :doc: Reroll a failed saving throw, once per long rest.
    $if: '@.level >= 9'
    '@.resources':
      +indomitable_points:
        :label: Indomitable Uses
        :doc: Expend to reroll a failed save. Restores on a long rest.
        current: .max
        max: 1 + (@.level >= 13) + (@.level >= 17)
        recover: long
  +ability_score_improvement_4:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 12'
    '@.improvements.level_12': '#.feature.ability_improvement(12)'
  +ability_score_improvement_5:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 14'
    '@.improvements.level_14': '#.feature.ability_improvement(14)'
  +ability_score_improvement_6:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 16'
    '@.improvements.level_16': '#.feature.ability_improvement(16)'
  +ability_score_improvement_7:
    :label: Epic Boon
    :doc: Add +2 to one ability score or +1 to two, or take an epic boon feat.
    $if: '@.level >= 19'
    '@.improvements.level_19': '#.feature.ability_improvement(19)'

# Subclasses mix into the character this file is applied to; each gates on
# `features.martial_archetype`, so only the chosen one adds anything.
subclass:
  champion: $mixin('champion.yaml')
  battle_master: $mixin('battle_master.yaml')
  eldritch_knight: $mixin('eldritch_knight.yaml')
