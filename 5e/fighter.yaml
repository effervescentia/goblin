# D&D 5e Fighter. Applied onto a 5e/character.yaml actor:
#   engine.apply(actor, 'fighter.yaml')

$: Character

'@.fighter': {}

'@.hit_die': d10
'@.hit_points':
  max: 10 + @.abilities.constitution.modifier
  current: '@.hit_points.max'
'@.proficiencies.armor':
  - all_armor
  - shields
'@.proficiencies.weapon':
  - simple_weapons
  - martial_weapons
'@.proficiencies.saving_throws':
  - strength
  - constitution
'@.skills.trained':
  :label: Skill Proficiencies
  :doc: 'Choose two: acrobatics, animal_handling, athletics, history, insight, intimidation, perception, survival.'
  :param: true
  :type: array
  :options: [acrobatics, animal_handling, athletics, history, insight, intimidation, perception, survival]
  :count: 2
  :unique: true
'@.features':
  +fighting_style:
    :label: Fighting Style
    :doc: Pick the combat style you trained in.
    :param: true
    :type: string
    :options: [archery, defense, dueling, great_weapon_fighting, protection, two_weapon_fighting]
  +second_wind:
    :label: Second Wind
    :doc: Regain hit points in a pinch, once per rest.
    '@.actions':
      +second_wind:
        :label: Second Wind
        :doc: Regain 1d10 + fighter level hit points.
        'heal()': 1d10 + @.level
  +action_surge:
    :label: Action Surge
    :doc: Take one additional action on your turn. Restores on a short rest.
    $if: '@.level >= 2'
    '@.resources':
      +action_surge:
        :label: Action Surge
        :doc: Expend to gain an additional action.
        current: 1
        max: 1 + (@.level >= 17)
  +martial_archetype:
    :label: Martial Archetype
    :doc: 'Choose a subclass: Champion, Battle Master, or Eldritch Knight.'
    :param: true
    :type: string
    :options: [champion, battle_master, eldritch_knight]
    $if: '@.level >= 3'
  +ability_score_improvement_1:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 4'
    '@.improvements.level_4':
      :label: Ability Score Improvement (level 4)
      :doc: 'Pick two: one ability twice for +2, or two abilities for +1 each.'
      :param: true
      :type: array
      :options: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      :count: 2
  +extra_attack:
    :label: Extra Attack
    :doc: Strike twice whenever you take the Attack action.
    $if: '@.level >= 5'
    '+@.attacks': 1 + (@.level >= 11) + (@.level >= 20)
    '@.actions':
      +extra_attack:
        :label: Extra Attack
        :doc: Make two attacks instead of one (three at 11, four at 20).
  +ability_score_improvement_2:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 6'
    '@.improvements.level_6':
      :label: Ability Score Improvement (level 6)
      :doc: 'Pick two: one ability twice for +2, or two abilities for +1 each.'
      :param: true
      :type: array
      :options: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      :count: 2
  +subclass_feature_1:
    :label: Martial Archetype Feature
    :doc: Martial archetype feature (see your subclass).
    $if: '@.level >= 7'
  +ability_score_improvement_3:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 8'
    '@.improvements.level_8':
      :label: Ability Score Improvement (level 8)
      :doc: 'Pick two: one ability twice for +2, or two abilities for +1 each.'
      :param: true
      :type: array
      :options: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      :count: 2
  +indomitable:
    :label: Indomitable
    :doc: Reroll a failed saving throw, once per long rest.
    $if: '@.level >= 9'
    '@.resources':
      +indomitable_points:
        :label: Indomitable Uses
        :doc: Expend to reroll a failed save.
        value: 1
        max: 1 + (@.level >= 13) + (@.level >= 17)
  +subclass_feature_2:
    :label: Martial Archetype Feature
    :doc: Martial archetype feature (see your subclass).
    $if: '@.level >= 10'
  +ability_score_improvement_4:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 12'
    '@.improvements.level_12':
      :label: Ability Score Improvement (level 12)
      :doc: 'Pick two: one ability twice for +2, or two abilities for +1 each.'
      :param: true
      :type: array
      :options: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      :count: 2
  +ability_score_improvement_5:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 14'
    '@.improvements.level_14':
      :label: Ability Score Improvement (level 14)
      :doc: 'Pick two: one ability twice for +2, or two abilities for +1 each.'
      :param: true
      :type: array
      :options: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      :count: 2
  +subclass_feature_3:
    :label: Martial Archetype Feature
    :doc: Martial archetype feature (see your subclass).
    $if: '@.level >= 15'
  +ability_score_improvement_6:
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    $if: '@.level >= 16'
    '@.improvements.level_16':
      :label: Ability Score Improvement (level 16)
      :doc: 'Pick two: one ability twice for +2, or two abilities for +1 each.'
      :param: true
      :type: array
      :options: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      :count: 2
  +subclass_feature_4:
    :label: Martial Archetype Feature
    :doc: Martial archetype feature (see your subclass).
    $if: '@.level >= 18'
  +ability_score_improvement_7:
    :label: Epic Boon
    :doc: Add +2 to one ability score or +1 to two, or take an epic boon feat.
    $if: '@.level >= 19'
    '@.improvements.level_19':
      :label: Epic Boon (level 19)
      :doc: 'Pick two: one ability twice for +2, or two abilities for +1 each.'
      :param: true
      :type: array
      :options: [strength, dexterity, constitution, intelligence, wisdom, charisma]
      :count: 2
