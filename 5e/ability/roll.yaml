# Rolled scores, applied when the character picks `ability_method: roll`:
# 4d6 per ability, dropping the lowest die.

'@': Character
$if: "@.ability_method == 'roll'"

'@.abilities':
  strength: '$.ability.rolled()'
  dexterity: '$.ability.rolled()'
  constitution: '$.ability.rolled()'
  intelligence: '$.ability.rolled()'
  wisdom: '$.ability.rolled()'
  charisma: '$.ability.rolled()'
