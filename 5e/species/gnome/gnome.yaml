'@': Character
$if: "@.species == 'gnome'"

'@.size': small
'@.speed': 30

'@.features':
  +darkvision:
    :label: Darkvision
    :doc: You can see in dim light within 60 feet as if it were bright light, and in darkness as if it were dim light.
  +gnomish_cunning:
    :label: Gnomish Cunning
    :doc: You have advantage on Intelligence, Wisdom, and Charisma saving throws.