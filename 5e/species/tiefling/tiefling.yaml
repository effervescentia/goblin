'@': Character
$if: "@.species == 'tiefling'"

'@.size': medium
'@.speed': 30

'@.features':
  +darkvision:
    :label: Darkvision
    :doc: You can see in dim light within 60 feet as if it were bright light, and in darkness as if it were dim light.
  +otherworldly_presence:
    :label: Otherworldly Presence
    :doc: You know the Thaumaturgy cantrip, using the same spellcasting ability as your Fiendish Legacy spells.