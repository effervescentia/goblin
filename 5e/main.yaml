# 5e/main.yaml — root entry: a complete playable fighter.
#
# `actor` is the base document; `adopt` lists patches applied in order, each
# at the actor's derived `level` (read after a first pass with `provided`).
# Template paths resolve relative to their own file.
#
# Play: goblin 5e/main.yaml --param name=Aria --param xp=6500 \
#         --param ability_method=point_buy \
#         --param abilities.strength.bought=7 … (points over 8, 27 total) \
#         --param features.fighting_style=dueling \
#         --param features.martial_archetype=champion \
#         --param skills.trained='["athletics", "perception"]' \
#         --param improvements.level_4='["strength", "strength"]'
#   (or ability_method=standard_array with abilities.<name>.assigned=15 …,
#    or ability_method=roll to roll 4d6 drop lowest for each,
#    or ability_method=roll_assign with abilities.<name>.roll=1..6)
# Missing choices come back as { query }; a full sheet as { data }.

$: Character

level: $tmpl('level.yaml')
feature: $tmpl('feature.yaml')
ability: $tmpl('ability/ability.yaml')

actor: $tmpl('character.yaml')
adopt:
  # Only the one matching `ability_method` applies.
  - $tmpl('ability/point_buy.yaml')
  - $tmpl('ability/standard_array.yaml')
  - $tmpl('ability/roll.yaml')
  - $tmpl('ability/roll_assign.yaml')
  - $tmpl('fighter/fighter.yaml')
  # Subclasses: only the one `features.martial_archetype` names applies.
  - $tmpl('fighter/champion.yaml')
  - $tmpl('fighter/battle_master.yaml')
  - $tmpl('fighter/eldritch_knight.yaml')
