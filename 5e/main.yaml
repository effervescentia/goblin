 # 5e/main.yaml — root entry: the whole tree resolves as { data }, with each
# character a nested Character actor under `party`, named for its params.
#
# Each character mixes in the class it picks. Template paths resolve
# relative to their own file.
#
# Play: P=aria
#       goblin 5e/main.yaml --param $P.name=Aria --param $P.xp=6500 \
#         --param $P.class=fighter --param $P.species=dwarf \
#         --param $P.ability_method=point_buy \
#         --param $P.abilities.strength.bought=7 … (points over 8, 27 total) \
#         --param $P.features.fighter.fighting_style=dueling \
#         --param $P.features.fighter.martial_archetype=champion \
#         --param $P.skills.trained='["athletics", "perception"]' \
#         --param $P.improvements.fighter_4='["strength", "strength"]'
#   (or ability_method=standard_array with abilities.<name>.assigned=15 …,
#    or ability_method=roll to roll 4d6 drop lowest for each,
#    or ability_method=roll_assign with abilities.<name>.roll=1..6)
# Missing choices come back as { query }; a full tree as { data }.
# Each level goes to the starting class unless `level_up` gives it to another:
#       goblin 5e/main.yaml --in s.json --invoke 'party.aria.level_up("rogue")'

level: $tmpl('level.yaml')
feature: $tmpl('feature.yaml')
ability: $tmpl('ability/ability.yaml')

party:
  aria: $tmpl('character.yaml', 'aria')

'recruit(name)': $.party[name] = $tmpl('character.yaml', name)

# Every action taken at the table, oldest first: each entry names its `actor`,
# its `action` and what it rolled.
log: []

# The fight in progress: start with `game.start_combat()`, end with `game.end_combat()`.
combat: null

# Table-level actions; `#` is still this document, so they reach `combat`.
game:
  'start_combat()': |
    #.combat = $tmpl('combat.yaml')
    $.log += [{ action: 'start_combat' }]
  'end_combat()': |
    #.combat = null
    $.log += [{ action: 'end_combat' }]
