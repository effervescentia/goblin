# Eldritch Knight martial archetype, applied when the fighter picks
# `features.fighter.martial_archetype: eldritch_knight`: Intelligence-based spellcasting
# with slots that come back on a long rest.

'@': Character
$if: "@.classes.fighter.level >= 3 && @.features.fighter.martial_archetype == 'eldritch_knight'"

'@.features.fighter':
  +spellcasting:
    :label: Spellcasting
    :doc: >-
      Cast wizard spells using Intelligence. Counts below are how many cantrips
      and spells you know at your level.
    ability: intelligence
    save_dc: 8 + [Proficiency](@.proficiency_bonus) + [INT](@.abilities.intelligence.modifier)
    attack_bonus: '[Proficiency](@.proficiency_bonus) + [INT](@.abilities.intelligence.modifier)'
    cantrips_known: 2 + (@.classes.fighter.level >= 10)
    spells_known: >-
      3 + (@.classes.fighter.level >= 4) + (@.classes.fighter.level >= 7) + (@.classes.fighter.level >= 8) + (@.classes.fighter.level >= 10) +
      (@.classes.fighter.level >= 11) + (@.classes.fighter.level >= 13) + (@.classes.fighter.level >= 14) + (@.classes.fighter.level >= 16) +
      (@.classes.fighter.level >= 19) + (@.classes.fighter.level >= 20)
    '@.resources':
      +spell_slots_1:
        :label: 1st-level Spell Slots
        :doc: Expend to cast a 1st-level spell. Restores on a long rest.
        current: .max
        max: 2 + (@.classes.fighter.level >= 4) + (@.classes.fighter.level >= 7)
        recover: long
      +spell_slots_2:
        $if: '@.classes.fighter.level >= 7'
        :label: 2nd-level Spell Slots
        :doc: Expend to cast a spell of 2nd level or lower. Restores on a long rest.
        current: .max
        max: 2 + (@.classes.fighter.level >= 10)
        recover: long
      +spell_slots_3:
        $if: '@.classes.fighter.level >= 13'
        :label: 3rd-level Spell Slots
        :doc: Expend to cast a spell of 3rd level or lower. Restores on a long rest.
        current: .max
        max: 2 + (@.classes.fighter.level >= 16)
        recover: long
      +spell_slots_4:
        $if: '@.classes.fighter.level >= 19'
        :label: 4th-level Spell Slots
        :doc: Expend to cast a spell of 4th level or lower. Restores on a long rest.
        current: .max
        max: 1
        recover: long
  +weapon_bond:
    $if: '@.classes.fighter.level >= 3'
    :label: Weapon Bond
    :doc: Bond with up to two weapons; you can't be disarmed of them and can summon one to your hand.
  +war_magic:
    $if: '@.classes.fighter.level >= 7'
    :label: War Magic
    :doc: After casting a cantrip with your action, make one weapon attack as a bonus action.
  +eldritch_strike:
    $if: '@.classes.fighter.level >= 10'
    :label: Eldritch Strike
    :doc: A creature you hit with a weapon has disadvantage on its next save against your spells.
  +arcane_charge:
    $if: '@.classes.fighter.level >= 15'
    :label: Arcane Charge
    :doc: When you use Action Surge, you can also teleport up to 30 feet.
  +improved_war_magic:
    $if: '@.classes.fighter.level >= 18'
    :label: Improved War Magic
    :doc: After casting any spell with your action, make one weapon attack as a bonus action.
