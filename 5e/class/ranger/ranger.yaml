'@': Character
$if: "@.class == 'ranger'"

'@.hit_die': d10
'@.hit_points':
  max: 10 + @.abilities.constitution.modifier
  current: '@.hit_points.max'
'@.proficiencies.weapon':
  - simple_weapons
  - martial_weapons
'@.proficiencies.armor':
  - light_armor
  - medium_armor
  - shields
'@.proficiencies.saving_throws':
  - strength
  - dexterity
'@.skills.trained':
  :label: Skill Proficiencies
  :doc: 'Choose three proficient skills.'
  :param: true
  :type: array
  :options:
    - animal_handling
    - athletics
    - insight
    - investigation
    - nature
    - perception
    - stealth
    - survival
  :count: 3
  :unique: true
'@.features':
  +spellcasting:
    :label: Spellcasting
  +favored_enemy:
    :label: Favored Enemy
  +weapon_mastery:
    :label: Weapon Mastery
  +deft_explorer:
    $if: '@.level >= 2'
    :label: Deft Explorer
  +fighting_style:
    $if: '@.level >= 2'
    :label: Fighting Style
  +ability_score_improvement_1:
    $if: '@.level >= 4'
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    '@.improvements.level_4': '$.feature.ability_improvement(4)'
  +extra_attack:
    $if: '@.level >= 5'
    :label: Extra Attack
  +roving:
    $if: '@.level >= 6'
    :label: Roving
  +ability_score_improvement_2:
    $if: '@.level >= 8'
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    '@.improvements.level_8': '$.feature.ability_improvement(8)'
  +expertise:
    $if: '@.level >= 9'
    :label: Expertise
  +tireless:
    $if: '@.level >= 10'
    :label: Tireless
  +ability_score_improvement_3:
    $if: '@.level >= 12'
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    '@.improvements.level_12': '$.feature.ability_improvement(12)'
  +relentless_hunter:
    $if: '@.level >= 13'
    :label: Relentless Hunter
  +naturess_veil:
    $if: '@.level >= 14'
    :label: Nature's Veil
  +ability_score_improvement_4:
    $if: '@.level >= 16'
    :label: Ability Score Improvement
    :doc: Add +2 to one ability score or +1 to two (or take a feat).
    '@.improvements.level_16': '$.feature.ability_improvement(16)'
  +precise_hunter:
    $if: '@.level >= 17'
    :label: Precise Hunter
  +feral_senses:
    $if: '@.level >= 18'
    :label: Feral Senses
  +epic_boon:
    $if: '@.level >= 19'
    :label: Epic Boon
  +foe_slayer:
    $if: '@.level >= 20'
    :label: Foe Slayer
