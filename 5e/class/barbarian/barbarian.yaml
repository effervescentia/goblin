'@': Character
$if: "$lib.list.has(@.class_names, 'barbarian')"

'@.classes':
  +barbarian:
    :label: Barbarian
    level: "@.class_level('barbarian')"
    qualified: '@.abilities.strength.base >= 13'

# A starting barbarian takes the hit die, saving throws, skill picks and
# proficiencies; one multiclassed into gets only the proficiencies below.
'@.skills':
  $if: "@.class == 'barbarian'"
  trained:
    :label: Skill Proficiencies
    :doc: 'Choose two proficient skills.'
    :param: true
    :type: array
    :options:
      - animal_handling
      - athletics
      - intimidation
      - nature
      - perception
      - survival
    :count: 2
    :unique: true
  $then:
    '@.hit_die': d12
    '@.proficiencies.saving_throws': [strength, constitution]
    '@.proficiencies.weapon': [+simple_weapons, +martial_weapons]
    '@.proficiencies.armor': [+light_armor, +medium_armor, +shields]
'@.proficiencies':
  $if: "@.class != 'barbarian'"
  weapon: [+martial_weapons]
  armor: [+shields]
'@.features':
  +barbarian:
    :label: Barbarian
    +rage:
      :label: Rage
      :doc: As a bonus action, gain Resistance to Bludgeoning, Piercing, and Slashing damage and bonus Strength damage. Uses increase with barbarian level; one restores on a short rest, all on a long rest.
    +unarmored_defense:
      :label: Unarmored Defense
      :doc: Without armor, your AC equals 10 + your Dexterity and Constitution modifiers; you can still use a Shield.
    +weapon_mastery:
      :label: Weapon Mastery
      :doc: Mastery properties of two weapons; the number increases at levels 4 and 10.
    +danger_sense:
      :label: Danger Sense
      :doc: Advantage on Dexterity saving throws unless you are Incapacitated.
    +reckless_attack:
      $if: '@.classes.barbarian.level >= 2'
      :label: Reckless Attack
      :doc: Gain Advantage on Strength attack rolls this turn, but attack rolls against you have Advantage until your next turn.
    +primal_knowledge:
      $if: '@.classes.barbarian.level >= 3'
      :label: Primal Knowledge
      :doc: Gain another Barbarian skill proficiency; while raging, make Acrobatics, Intimidation, Perception, Stealth, and Survival checks with Strength.
    +ability_score_improvement_1:
      $if: '@.classes.barbarian.level >= 4'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.barbarian_4': "$.feature.ability_improvement('Barbarian', 4)"
    +extra_attack:
      $if: '@.classes.barbarian.level >= 5'
      :label: Extra Attack
      :doc: Attack twice instead of once whenever you take the Attack action.
    +fast_movement:
      $if: '@.classes.barbarian.level >= 5'
      :label: Fast Movement
      :doc: Your Speed increases by 10 feet while you aren't wearing Heavy armor.
    +feral_instinct:
      $if: '@.classes.barbarian.level >= 7'
      :label: Feral Instinct
      :doc: Advantage on Initiative rolls.
    +instinctive_pounce:
      $if: '@.classes.barbarian.level >= 7'
      :label: Instinctive Pounce
      :doc: When you enter your Rage, move up to half your Speed.
    +ability_score_improvement_2:
      $if: '@.classes.barbarian.level >= 8'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.barbarian_8': "$.feature.ability_improvement('Barbarian', 8)"
    +brutal_strike:
      $if: '@.classes.barbarian.level >= 9'
      :label: Brutal Strike
      :doc: When attacking recklessly, forgo Advantage on one Strength attack to deal an extra 1d10 damage and apply Forceful Blow or Hamstring Blow.
    +relentless_rage:
      $if: '@.classes.barbarian.level >= 11'
      :label: Relentless Rage
      :doc: When raging and reduced to 0 hit points, succeed on a DC 10 Constitution save to drop to twice your barbarian level instead. The DC rises by 5 per use and resets on a short or long rest.
    +ability_score_improvement_3:
      $if: '@.classes.barbarian.level >= 12'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.barbarian_12': "$.feature.ability_improvement('Barbarian', 12)"
    +improved_brutal_strike_1:
      $if: '@.classes.barbarian.level >= 13'
      :label: Improved Brutal Strike
      :doc: Add Staggering Blow and Sundering Blow to your Brutal Strike options.
    +persistent_rage:
      $if: '@.classes.barbarian.level >= 15'
      :label: Persistent Rage
      :doc: Regain all Rage uses when you roll Initiative (once per long rest), and your Rage lasts 10 minutes without needing to be extended.
    +ability_score_improvement_4:
      $if: '@.classes.barbarian.level >= 16'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.barbarian_16': "$.feature.ability_improvement('Barbarian', 16)"
    +improved_brutal_strike_2:
      $if: '@.classes.barbarian.level >= 17'
      :label: Improved Brutal Strike
      :doc: Brutal Strike deals an extra 2d10 damage and can apply two different effects.
    +indomitable_might:
      $if: '@.classes.barbarian.level >= 18'
      :label: Indomitable Might
      :doc: If a Strength check or saving throw total is lower than your Strength score, use the score instead.
    +epic_boon:
      $if: '@.classes.barbarian.level >= 19'
      :label: Epic Boon
      :doc: Gain an Epic Boon feat or another feat for which you qualify.
    +primal_champion:
      $if: '@.classes.barbarian.level >= 20'
      :label: Primal Champion
      :doc: Your Strength and Constitution scores increase by 4, to a maximum of 25.
