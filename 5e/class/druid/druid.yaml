'@': Character
$if: "$lib.list.has(@.class_names, 'druid')"

'@.classes':
  +druid:
    :label: Druid
    level: "@.class_level('druid')"
    qualified: '@.abilities.wisdom.base >= 13'

# A starting druid takes the hit die, saving throws, skill picks and
# proficiencies; one multiclassed into gets only the proficiencies below.
'@.skills':
  $if: "@.class == 'druid'"
  trained:
    :label: Skill Proficiencies
    :doc: 'Choose two proficient skills.'
    :param: true
    :type: array
    :options:
      - animal_handling
      - arcana
      - insight
      - medicine
      - nature
      - perception
      - religion
      - survival
    :count: 2
    :unique: true
  $then:
    '@.hit_die': d8
    '@.proficiencies.saving_throws': [intelligence, wisdom]
    '@.proficiencies.weapon': [+simple_weapons]
    '@.proficiencies.armor': [+light_armor, +shields]
'@.proficiencies':
  $if: "@.class != 'druid'"
  armor: [+light_armor, +shields]
'@.features':
  +druid:
    :label: Druid
    +spellcasting:
      :label: Spellcasting
      :doc: Cast Druid spells using Wisdom; cantrips, prepared spells, and slots increase with druid level. Slots restore on a long rest.
    +druidic:
      :label: Druidic
      :doc: Know Druidic, the secret language of druids, and always have Speak with Animals prepared.
    +primal_order:
      :label: Primal Order
      :doc: Choose Magician (an extra cantrip and your Wisdom modifier to Arcana and Nature checks) or Warden (Martial weapon proficiency and Medium armor training).
    +wild_shape:
      $if: '@.classes.druid.level >= 2'
      :label: Wild Shape
      :doc: As a bonus action, shape-shift into a Beast form you know. Uses increase at levels 6 and 17; one restores on a short rest, all on a long rest.
    +wild_companion:
      $if: '@.classes.druid.level >= 2'
      :label: Wild Companion
      :doc: Expend a spell slot or Wild Shape use to cast Find Familiar without Material components; the familiar is Fey.
    +ability_score_improvement_1:
      $if: '@.classes.druid.level >= 4'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.druid_4': "$.feature.ability_improvement('Druid', 4)"
    +wild_resurgence:
      $if: '@.classes.druid.level >= 5'
      :label: Wild Resurgence
      :doc: Once per turn, expend a spell slot to regain a Wild Shape use; once per long rest, expend a Wild Shape use for a level 1 spell slot.
    +elemental_fury:
      $if: '@.classes.druid.level >= 7'
      :label: Elemental Fury
      :doc: Choose Potent Spellcasting (your Wisdom modifier to cantrip damage) or Primal Strike (an extra 1d8 elemental damage once per turn on a weapon or Beast form hit).
    +ability_score_improvement_2:
      $if: '@.classes.druid.level >= 8'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.druid_8': "$.feature.ability_improvement('Druid', 8)"
    +ability_score_improvement_3:
      $if: '@.classes.druid.level >= 12'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.druid_12': "$.feature.ability_improvement('Druid', 12)"
    +improved_elemental_fury:
      $if: '@.classes.druid.level >= 15'
      :label: Improved Elemental Fury
      :doc: Potent Spellcasting adds 300 feet to cantrip range, or Primal Strike deals 2d8.
    +ability_score_improvement_4:
      $if: '@.classes.druid.level >= 16'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.druid_16': "$.feature.ability_improvement('Druid', 16)"
    +beast_spells:
      $if: '@.classes.druid.level >= 18'
      :label: Beast Spells
      :doc: Cast spells while in Wild Shape, except those with a Material component that has a cost or is consumed.
    +epic_boon:
      $if: '@.classes.druid.level >= 19'
      :label: Epic Boon
      :doc: Gain an Epic Boon feat or another feat for which you qualify.
    +archdruid:
      $if: '@.classes.druid.level >= 20'
      :label: Archdruid
      :doc: Regain a Wild Shape use when you roll Initiative with none left, and once per long rest convert Wild Shape uses into spell slots. You also age slowly.
