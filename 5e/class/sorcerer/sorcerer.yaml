'@': Character
$if: "$lib.list.has(@.class_names, 'sorcerer')"

'@.classes':
  +sorcerer:
    :label: Sorcerer
    level: "@.class_level('sorcerer')"
    qualified: '@.abilities.charisma.base >= 13'

# A starting sorcerer takes the hit die, saving throws, skill picks and
# proficiencies; one multiclassed into gets only the proficiencies below.
'@.skills':
  $if: "@.class == 'sorcerer'"
  trained:
    :label: Skill Proficiencies
    :doc: 'Choose two proficient skills.'
    :param: true
    :type: array
    :options:
      - arcana
      - deception
      - insight
      - intimidation
      - persuasion
      - religion
    :count: 2
    :unique: true
  $then:
    '@.hit_die': d6
    '@.proficiencies.saving_throws': [constitution, charisma]
    '@.proficiencies.weapon': [+simple_weapons]
'@.features':
  +sorcerer:
    :label: Sorcerer
    +spellcasting:
      :label: Spellcasting
      :doc: Cast Sorcerer spells using Charisma; cantrips, prepared spells, and slots increase with sorcerer level. Slots restore on a long rest.
    +innate_sorcery:
      :label: Innate Sorcery
      :doc: As a bonus action, raise your spell save DC by 1 and gain Advantage on Sorcerer spell attacks for 1 minute. Two uses, restoring on a long rest.
    +font_of_magic:
      $if: '@.classes.sorcerer.level >= 2'
      :label: Font of Magic
      :doc: Sorcery Points equal to your sorcerer level, convertible to and from spell slots. Restores on a long rest.
    +metamagic_1:
      $if: '@.classes.sorcerer.level >= 2'
      :label: Metamagic
      :doc: Learn two Metamagic options, spending Sorcery Points to alter your spells.
    +ability_score_improvement_1:
      $if: '@.classes.sorcerer.level >= 4'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.sorcerer_4': "$.feature.ability_improvement('Sorcerer', 4)"
    +sorcerous_restoration:
      $if: '@.classes.sorcerer.level >= 5'
      :label: Sorcerous Restoration
      :doc: On a short rest, regain Sorcery Points up to half your sorcerer level. Restores on a long rest.
    +sorcery_incarnate:
      $if: '@.classes.sorcerer.level >= 7'
      :label: Sorcery Incarnate
      :doc: Spend 2 Sorcery Points to use Innate Sorcery with no uses left; while it's active, apply two Metamagic options to a spell.
    +ability_score_improvement_2:
      $if: '@.classes.sorcerer.level >= 8'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.sorcerer_8': "$.feature.ability_improvement('Sorcerer', 8)"
    +metamagic_2:
      $if: '@.classes.sorcerer.level >= 10'
      :label: Metamagic
      :doc: Learn two more Metamagic options.
    +ability_score_improvement_3:
      $if: '@.classes.sorcerer.level >= 12'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.sorcerer_12': "$.feature.ability_improvement('Sorcerer', 12)"
    +ability_score_improvement_4:
      $if: '@.classes.sorcerer.level >= 16'
      :label: Ability Score Improvement
      :doc: Add +2 to one ability score or +1 to two (or take a feat).
      '@.improvements.sorcerer_16': "$.feature.ability_improvement('Sorcerer', 16)"
    +metamagic_3:
      $if: '@.classes.sorcerer.level >= 17'
      :label: Metamagic
      :doc: Learn two more Metamagic options.
    +epic_boon:
      $if: '@.classes.sorcerer.level >= 19'
      :label: Epic Boon
      :doc: Gain an Epic Boon feat or another feat for which you qualify.
    +arcane_apotheosis:
      $if: '@.classes.sorcerer.level >= 20'
      :label: Arcane Apotheosis
      :doc: While Innate Sorcery is active, use one Metamagic option each turn without spending Sorcery Points.
