# Standard array, applied when the character picks
# `ability_method: standard_array`: 15, 14, 13, 12, 10 and 8, one per ability.

$: Character

'@.standard_array':
  $if: "@.ability_method == 'standard_array'"
  :label: Standard Array
  :doc: Assign 15, 14, 13, 12, 10 and 8, one to each ability.
  # Six scores over six slots: each used exactly once.
  '!validate':
    - $lib.list.count(.assigned, 15) == 1
    - $lib.list.count(.assigned, 14) == 1
    - $lib.list.count(.assigned, 13) == 1
    - $lib.list.count(.assigned, 12) == 1
    - $lib.list.count(.assigned, 10) == 1
    - $lib.list.count(.assigned, 8) == 1
  assigned:
    - '@.abilities.strength.assigned'
    - '@.abilities.dexterity.assigned'
    - '@.abilities.constitution.assigned'
    - '@.abilities.intelligence.assigned'
    - '@.abilities.wisdom.assigned'
    - '@.abilities.charisma.assigned'

'@.abilities':
  $if: "@.ability_method == 'standard_array'"
  strength: "#.ability.assigned('Strength')"
  dexterity: "#.ability.assigned('Dexterity')"
  constitution: "#.ability.assigned('Constitution')"
  intelligence: "#.ability.assigned('Intelligence')"
  wisdom: "#.ability.assigned('Wisdom')"
  charisma: "#.ability.assigned('Charisma')"
