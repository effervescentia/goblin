# 5e/combat.yaml — a fight between some of the party, written in at `combat`
# by `game.start_combat()` in 5e/main.yaml and cleared by `game.end_combat()`.
#
# Members are party keys, offered from whoever is in the party when asked;
# each rolls initiative once, and turns go highest first (Dexterity breaks ties).

$actor: Combat

members:
  :label: Combatants
  :doc: The party members in this fight.
  :param: true
  :type: array
  :unique: true
  :options: $lib.record.keys($.party)
  '!validate':
    - $lib.list.size(.) > 0

# Each member's initiative roll as a log entry: d20 plus their initiative bonus.
'_roll(name)': "{ actor: $.party[name].name, action: 'initiative', initiative: [d20](1d20) + [Initiative]($.party[name].initiative.base) }"
# Rolled once members are in, by `roll_initiative()`; until then, empty.
rolls: {}
'roll_initiative()': |
  @.rolls = $lib.record.from(@.members, ._roll)
  $.log += $lib.record.values(@.rolls)
'_score(name)': .rolls[name].initiative
initiative: $lib.record.from($lib.record.keys(.rolls), ._score)
# Tied initiative goes to the higher Dexterity score.
'_dexterity_of(name)': $.party[name].abilities.dexterity.base
_dexterity: $lib.record.from(@.members, ._dexterity_of)
order: $lib.record.rank(.initiative, ._dexterity)

round: 1
# Index into `order` of whoever is acting.
turn: 0
current: '.order[.turn]'

# Logs whose turn ended; wrapping past the last combatant starts the next round.
'end_turn()': |
  $.log += [{ actor: $.party[@.current].name, action: 'end_turn', round: @.round }]
  @.round += $lib.math.floor((@.turn + 1) / $lib.list.size(@.order))
  @.turn = (@.turn + 1) % $lib.list.size(@.order)
