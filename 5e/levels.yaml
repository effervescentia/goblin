# D&D 5e level progression: XP thresholds plus the derivation function.
# Bound in 5e/main.yaml (`levels: $tmpl('levels.yaml')`) and called un-attached
# as #.levels.level_for(@.xp.value). Inside the body, `.` is this document's
# root and `xp` is the call argument.

thresholds:
  l2: 300
  l3: 900
  l4: 2700
  l5: 6500
  l6: 14000
  l7: 23000
  l8: 34000
  l9: 48000
  l10: 64000
  l11: 85000
  l12: 100000
  l13: 120000
  l14: 140000
  l15: 165000
  l16: 195000
  l17: 225000
  l18: 265000
  l19: 305000
  l20: 355000

# Each met threshold adds 1 (comparisons coerce to 0/1 — no conditionals).
level_for(xp): >-
  1 + (xp >= .thresholds.l2) + (xp >= .thresholds.l3) +
  (xp >= .thresholds.l4) + (xp >= .thresholds.l5) +
  (xp >= .thresholds.l6) + (xp >= .thresholds.l7) +
  (xp >= .thresholds.l8) + (xp >= .thresholds.l9) +
  (xp >= .thresholds.l10) + (xp >= .thresholds.l11) +
  (xp >= .thresholds.l12) + (xp >= .thresholds.l13) +
  (xp >= .thresholds.l14) + (xp >= .thresholds.l15) +
  (xp >= .thresholds.l16) + (xp >= .thresholds.l17) +
  (xp >= .thresholds.l18) + (xp >= .thresholds.l19) +
  (xp >= .thresholds.l20)

# Proficiency climbs +1 at levels 5, 9, 13, 17.
'proficiency_for(level)': 2 + $lib.math.floor((level - 1) / 4)
