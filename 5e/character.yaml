$actor: Character

name:
  :doc: Your hero's name, as sung by bards.
  :param: true
  :type: string

xp:
  :doc: Experience points earned in play.
  :param: true
  :type: integer
  :default: 0
add_xp(xp): |
  @.xp += xp
  $.log += [{ actor: @.name, action: 'add_xp', xp: xp }]

level: '$.level.level_for([XP](.xp))'

# How the six scores start; the method mixed in below adds its choice to
# each ability.
ability_method:
  :label: Ability Score Method
  :doc: 'point_buy: spend 27 points on scores from 8 to 15. standard_array: assign 15, 14, 13, 12, 10 and 8. roll: roll 4d6 per ability, dropping the lowest die. roll_assign: roll six scores that way, then assign each to an ability.'
  :param: true
  :type: string
  :options: $lib.record.keys(._ability_methods)

# Pick lists filled by the features that grant them; an ability counts its own
# name across all of them, so twice is +2 and once each is +1 apiece.
improvements:
  :label: Ability Score Improvements
  :doc: Choices made at the levels that grant an improvement.

abilities:
  strength: "$.ability.entry('strength', 'Strength')"
  dexterity: "$.ability.entry('dexterity', 'Dexterity')"
  constitution: "$.ability.entry('constitution', 'Constitution')"
  intelligence: "$.ability.entry('intelligence', 'Intelligence')"
  wisdom: "$.ability.entry('wisdom', 'Wisdom')"
  charisma: "$.ability.entry('charisma', 'Charisma')"

# Every method mixes in; each gates on `ability_method`, so only the chosen one
# adds anything. After `abilities`, whose entries the methods merge into.
_ability_methods:
  point_buy: $mixin('ability/point_buy.yaml')
  standard_array: $mixin('ability/standard_array.yaml')
  roll: $mixin('ability/roll.yaml')
  roll_assign: $mixin('ability/roll_assign.yaml')

proficiency_bonus: '$.level.proficiency_for([Level](.level))'

armor_class: '10 + [DEX](.abilities.dexterity.modifier)'
speed:
  :type: integer
attacks: 1
# The lowest d20 roll that scores a critical hit; a Champion widens it.
critical_hit: 20

initiative:
  base: '[DEX](@.abilities.dexterity.modifier)'
  'roll()': 1d20 + [Initiative](.base)

hit_die:
  :doc: Hit die granted by your starting class; its patch fills this slot.
  :type: die
hit_points:
  '!validate':
    - .current >= 0
    - .current <= .max
  current: '[Max HP](.max)'
  max: '[Initial HP]($lib.dice.max(@.hit_die)) + [CON](@.abilities.constitution.modifier)'

features: {}
actions:
  unarmed_strike:
    :label: Unarmed Strike
    die: d4
    type: action
    # Attack with Strength and proficiency; the hit deals the die plus Strength.
    # Logged at the table, under whoever made it.
    'roll()': |
      $.log += [{ actor: @.name, action: 'unarmed_strike', attack: [d20](1d20) + [STR](@.abilities.strength.modifier) + [Proficiency](@.proficiency_bonus), damage: [{.die}]($lib.dice.roll(.die)) + [STR](@.abilities.strength.modifier) }]
proficiencies:
  armor: []
  weapon: []
  saving_throws: []
  skill: []
  tool: []
# Expendable uses: each entry has `current`, `max` and `recover` — `short`
# (back on any rest) or `long` (back only on a long rest).
resources: {}

species:
  :label: Species
  :doc: Choose a species for your character.
  :param: true
  :type: string
  :options: $lib.record.keys(._species)

_species:
  aasimar: $mixin('species/aasimar/aasimar.yaml')
  dragonborn: $mixin('species/dragonborn/dragonborn.yaml')
  dwarf: $mixin('species/dwarf/dwarf.yaml')
  elf: $mixin('species/elf/elf.yaml')
  gnome: $mixin('species/gnome/gnome.yaml')
  goliath: $mixin('species/goliath/goliath.yaml')
  halfling: $mixin('species/halfling/halfling.yaml')
  human: $mixin('species/human/human.yaml')
  orc: $mixin('species/orc/orc.yaml')
  tiefling: $mixin('species/tiefling/tiefling.yaml')

background:
  :label: Background
  :doc: Choose a background for your character.
  :param: true
  :type: string
  :options: $lib.record.keys(._backgrounds)

_backgrounds:
  acolyte: $mixin('background/acolyte.yaml')
  artisan: $mixin('background/artisan.yaml')

class:
  :label: Class
  :doc: Choose a starting class for your character.
  :param: true
  :type: string
  :options: $lib.record.keys(._classes)

# The class each level past the first went to, keyed `level_<n>`; a level not
# chosen goes to the starting class. `level_up(name)` picks the current level's.
level_choices: {}
'level_up(name)': |
  @.level_choices['level_' + @.level] = name
  $.log += [{ actor: @.name, action: 'level_up', level: @.level, class: name }]

# Every class taken, the starting one first; each mixes in below.
class_names: $lib.set.union([@.class], $lib.record.values(@.level_choices))
'class_level(name)': >-
  (name == @.class) * (@.level - $lib.list.length($lib.record.values(@.level_choices))) +
  $lib.list.count($lib.record.values(@.level_choices), name)

# One entry per class taken, added by its file: its `level`, its `hit_die`, and
# whether the scores meet its multiclassing prerequisite (`qualified`). A class
# can be taken past the first only when every class held qualifies.
classes:
  '!validate':
    - $lib.list.count(.*.level, 0) == 0
    - $lib.list.length(.*) == 1 || $lib.list.count(.*.qualified, false) == 0

_classes:
  barbarian: $mixin('class/barbarian/barbarian.yaml')
  bard: $mixin('class/bard/bard.yaml')
  cleric: $mixin('class/cleric/cleric.yaml')
  druid: $mixin('class/druid/druid.yaml')
  fighter: $mixin('class/fighter/fighter.yaml')
  monk: $mixin('class/monk/monk.yaml')
  paladin: $mixin('class/paladin/paladin.yaml')
  ranger: $mixin('class/ranger/ranger.yaml')
  rogue: $mixin('class/rogue/rogue.yaml')
  sorcerer: $mixin('class/sorcerer/sorcerer.yaml')
  warlock: $mixin('class/warlock/warlock.yaml')
  wizard: $mixin('class/wizard/wizard.yaml')

# A short rest refills the `short` resources; a long rest refills everything.
# Each logs the hit points it left the character on.
rest:
  'short()': |
    @.hit_points.current = $lib.math.min(@.hit_points.current + @.hit_die, @.hit_points.max)
    @.resources.{.recover == 'short'}.current = .max
    $.log += [{ actor: @.name, action: 'short_rest', hit_points: @.hit_points.current }]
  'long()': |
    @.hit_points.current = @.hit_points.max
    @.resources.*.current = .max
    $.log += [{ actor: @.name, action: 'long_rest', hit_points: @.hit_points.current }]
