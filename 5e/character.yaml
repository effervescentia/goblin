# D&D 5e (2014 SRD-ish) character basics.
#
# Play it:
#   goblin 5e/character.yaml --param name=Aria --param xp=6500
# Without params the CLI returns { query: [...] } (name); a class patch adds
# its own choices (a fighter from level 4 asks for `improvements`).
#
# Adopt a class in code (the CLI does not apply patches): evaluate the actor
# to read its derived level, then engine.apply(actor, 'fighter.yaml', level).
# XP thresholds follow the standard progression (L2 at 300 … L20 at 355000).

$: Character

# Identity — provided by the player.
name:
  :doc: Your hero's name, as sung by bards.
  :param: true
  :type: string

# Experience — provided by the table, 0 if omitted.
xp:
  :doc: Experience points earned in play.
  :param: true
  :type: integer
  :default: 0

level: '#.levels.level_for(@.xp)'

# How the six scores start; the matching patch (5e/point_buy.yaml,
# 5e/standard_array.yaml, 5e/roll.yaml or 5e/roll_assign.yaml) adds that
# method's choice to each ability.
ability_method:
  :label: Ability Score Method
  :doc: 'point_buy: spend 27 points on scores from 8 to 15. standard_array: assign 15, 14, 13, 12, 10 and 8. roll: roll 4d6 per ability, dropping the lowest die. roll_assign: roll six scores that way, then assign each to an ability.'
  :param: true
  :type: string
  :options: [point_buy, standard_array, roll, roll_assign]

# Pick lists filled by the features that grant them; an ability counts its own
# name across all of them, so twice is +2 and once each is +1 apiece.
improvements:
  :label: Ability Score Improvements
  :doc: Choices made at the levels that grant an improvement.

abilities:
  strength: "#.ability.entry('strength', 'Strength')"
  dexterity: "#.ability.entry('dexterity', 'Dexterity')"
  constitution: "#.ability.entry('constitution', 'Constitution')"
  intelligence: "#.ability.entry('intelligence', 'Intelligence')"
  wisdom: "#.ability.entry('wisdom', 'Wisdom')"
  charisma: "#.ability.entry('charisma', 'Charisma')"

utils:
  'ability_modifier(x)': $lib.math.floor((x - 10) / 2)

proficiency_bonus: '#.levels.proficiency_for(@.level)'

armor_class: '10 + $.abilities.dexterity.modifier'
speed: 30
attacks: 1

initiative:
  base: $.abilities.dexterity.modifier
  'roll()': 1d20 + .base

hit_die:
  :doc: Hit die granted by your class; the adopted class patch fills this slot.
  :type: die
hit_points:
  '!validate':
    - .current >= 0
    - .current <= .max
  current: 8
  max: 8

features: {}
actions:
  unarmed_strike:
    :label: Unarmed Strike
    die: d4
    type: action
proficiencies:
  armor: []
  weapon: []
  saving_throws: []
resources: {}

rest:
  'short()': |
    @.hit_points.current = $lib.math.min(@.hit_points.current + @.hit_die, @.hit_points.max)
  'long()': |
    @.hit_points.current = @.hit_points.max
