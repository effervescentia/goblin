# D&D 5e (2014 SRD-ish) character basics.
#
# Play it:
#   goblin 5e/character.yaml --param name=Aria --param xp=6500
# Without params the CLI returns { query: [...] } (name, xp).
#
# Adopt a class in code (the CLI does not apply patches): evaluate the actor
# to read its derived level, then engine.apply(actor, 'fighter.yaml', level).
# XP thresholds follow the standard progression (L2 at 300 … L20 at 355000).

$: Character

# Identity — provided by the player.
name:
  :doc: Your hero's name, as sung by bards.
  :param: true
  :type: string

# Experience — provided by the table; level derives from it below.
xp:
  :doc: Experience points earned in play.
  :param: true
  :type: integer

level: '#.levels.level_for(@.xp.value)'

abilities:
  strength:
    base: 10
    modifier: $.utils.ability_modifier(.base)
  dexterity:
    base: 10
    modifier: $.utils.ability_modifier(.base)
  constitution:
    base: 10
    modifier: $.utils.ability_modifier(.base)
  intelligence:
    base: 10
    modifier: $.utils.ability_modifier(.base)
  wisdom:
    base: 10
    modifier: $.utils.ability_modifier(.base)
  charisma:
    base: 10
    modifier: $.utils.ability_modifier(.base)

utils:
  'ability_modifier(x)': $.math.floor((x - 10) / 2)

# Proficiency climbs with level via the progression binding in 5e/main.yaml.
proficiency_bonus: '#.levels.proficiency_for(@.level)'

armor_class: '10 + $.abilities.dexterity.modifier'
speed: 30
attacks: 1

initiative:
  base: $.abilities.dexterity.modifier
  'roll()': 1d20 + .base

hit_die: d8
hit_points:
  '!validate':
    - .value >= 0
    - .value <= .max
  value: 8
  max: 8

features: {}
actions:
  unarmed_strike:
    die: d4
    type: action
proficiencies:
  armor: []
  weapon: []
  saving_throws: []
resources: {}

rest:
  'short()': |
    @.hit_points.value = $.math.min(@.hit_points.value + @.hit_die, @.hit_points.max)
  'long()': |
    @.hit_points.value = @.hit_points.max
