# Standard library: `$lib` is implicitly loaded — native `math`, `dice`, `list`, `set` and `record`,
# plus anything in src/lib/lib.yaml. No attaching needed.

floored: $lib.math.floor(2.9) # → 2
smallest: $lib.math.min(3, 9) # → 3
ability_roll: $lib.dice.keep_highest(4, 6, 3) # 4d6 drop lowest → 3..18

# `list` reads choices back out of a table of `:param` picks — what was
# taken, never the `:options` on offer.
picks:
  first:
    :doc: Pick a skill.
    :param: true
    :type: string
    :default: athletics
  second:
    :doc: Pick another.
    :param: true
    :type: string
    :default: athletics
athletics_picks: $lib.list.count(@.picks, 'athletics') # → 2
picks_made: $lib.list.size(@.picks) # → 2
trained_in_stealth: $lib.list.has(@.picks, 'stealth') # → 0

# `set` treats lists as sets: no repeats, first appearance first.
melee: [athletics, intimidation]
scouting: [athletics, perception, survival]
either: $lib.set.union(@.melee, @.scouting) # → [athletics, intimidation, perception, survival]
both: $lib.set.intersection(@.melee, @.scouting) # → [athletics]
melee_only: $lib.set.difference(@.melee, @.scouting) # → [intimidation]
melee_is_scouting: $lib.set.subset(@.melee, @.scouting) # → 0
picked_athletics: $lib.set.subset(['athletics'], @.picks) # → 1

# `record` reads a record as a table keyed by name. `from` takes a function,
# named by its ref, and calls it with each key.
scores: { ash: 12, bree: 17, cade: 9 }
names: $lib.record.keys(@.scores) # → [ash, bree, cade]
ranking: $lib.record.rank(@.scores) # → [bree, ash, cade]
# Later records break ties: ash and dov both scored 12.
rivals: { ash: 12, dov: 12 }
speed: { ash: 2, dov: 5 }
photo_finish: $lib.record.rank(@.rivals, @.speed) # → [dov, ash]
'doubled(name)': '#.scores[name] * 2'
doubles: "$lib.record.from(['ash', 'cade'], #.doubled)" # → { ash: 24, cade: 18 }
