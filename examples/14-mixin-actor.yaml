# Mixins: a mixin call (below) merges a document into the actor of the
# nearest document up the template chain declaring the actor its `@` names —
# here this one, via `$actor`. The key holding the call is consumed; the mixin's writes land
# like a patch's, with `:events` citing it (see 14-mixin-boon.yaml). Keep
# call shapes out of comments: discovery scans the text.

$actor: Adventurer

speed: 30
gold: 10
boon: $mixin('14-mixin-boon.yaml') # → gone; speed 40, gold 15
curse: $mixin('14-mixin-curse.yaml') # → gone; its root `$if` fails, so gold stays 15
