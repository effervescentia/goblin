# Dice: `dN` / `NdM`.
# Standalone → a Die spec (serialized back to text; rolls when used in math).
# Inline in a larger expression → rolled immediately into a number. Only a
# string with a ref is an expression: plain `1d20 + 2` stays text.

hit_die: d8 # → "d8"
damage: 2d6 # → "2d6"
dex_bonus: 2
initiative: 1d20 + $.dex_bonus # → a rolled number between 3 and 22
heal: $.hit_die + 0 # Die used in arithmetic rolls → 1..8
healed: $.heal # The same roll: a field rolls once per evaluation
