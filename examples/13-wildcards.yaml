# Wildcards: a `*` path segment matches every child — list items, or record
# fields (never metadata, rules or functions); a `{predicate}` segment only
# those the predicate holds for, with `.` bound to the child. Read, it is the list of
# the matches that resolve; assigned, it writes each one, evaluating the
# right side with `.` bound to the record being written.

resources:
  surge:
    current: 0
    max: 2
    recover: short
  indomitable:
    current: 0
    max: 3
    recover: long

maxes: $.resources.*.max # → [2, 3]
pools: $lib.list.size($.resources.*.max) # → 2
short_maxes: $.resources.{.recover == 'short'}.max # → [2]

# Called in code (`rest.short()`): refills only the `short` resources.
rest:
  'short()': $.resources.{.recover == 'short'}.current = .max
