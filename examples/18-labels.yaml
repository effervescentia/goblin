# Labelled expressions: `[Label](expr)` names part of an expression for
# display. The field prints `{ :value, :formula, :parts }`; refs read the value.

dexterity: 2
proficiency: 3
strength: 1

armor_class: '10 + [Dexterity](#.dexterity)' # → 12, formula "10 + Dexterity"
attack: '[Proficiency](#.proficiency) + [Strength](#.strength)' # → 4
# → 1d8 rolled, plus 1; its `roll` event carries formula "Weapon + Strength" and both parts.
damage: '[Weapon](1d8) + [Strength](#.strength)'
touch: '#.armor_class - #.dexterity' # → 10: reads through the label
# `{ref}` in a label reads that ref: the formula reads "d8 + Strength", the part is labelled d8.
weapon_die: d8
weapon_damage: '[{#.weapon_die}]($lib.dice.roll(#.weapon_die)) + [Strength](#.strength)'
