# Constrained choices (`:options`, `:min`/`:max`, `:count`, `:unique`).
# `:options` lists the allowed values: a scalar must equal one entry, every
# array item must equal one. `:min`/`:max` bound numbers inclusively.
# `:count` requires an exact array length;
# `:unique: true` requires distinct array items. Violations throw instead of
# resolving; the `{ query }` report carries the constraints — and the node's
# `:label`, so a UI can title the prompt. `:options` may be an expression,
# computed where the param lives, so the choices follow the tree.

style:
  :label: Fighting Style
  :doc: Pick a fighting style.
  :param: true
  :type: string
  :options: [archery, dueling]

trained:
  :doc: Pick two skills.
  :param: true
  :type: array
  :options: [arcana, history, stealth]
  :count: 2
  :unique: true

score:
  :doc: Point-buy score.
  :param: true
  :type: integer
  :min: 8
  :max: 15

stable: { pony: 1, warhorse: 3 }
mount:
  :doc: Pick a mount from the stable.
  :param: true
  :type: string
  :options: $lib.record.keys(#.stable) # → [pony, warhorse]
